    <script>
        (function() {
            const SSO_STORAGE_KEY = 'pinball_portal_user';
            function extractTicket() {
                try {
                    const searchParams = new URLSearchParams(window.location.search);
                    const hashStr = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
                    const hashParams = new URLSearchParams(hashStr);
                    return searchParams.get('ticket') || searchParams.get('ssoTicket') || searchParams.get('sso_ticket') || searchParams.get('token') ||
                           hashParams.get('ticket') || hashParams.get('ssoTicket') || hashParams.get('sso_ticket') || hashParams.get('token');
                } catch {
                    return null;
                }
            }

            const ssoTicket = extractTicket();
            if (ssoTicket) {
                try {
                    const parts = ssoTicket.split('.');
                    if (parts.length >= 2) {
                        const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                        const padded = base64.padEnd(base64.length + (4 - (base64.length % 4)) % 4, '=');
                        const json = decodeURIComponent(
                            atob(padded)
                                .split('')
                                .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                                .join('')
                        );
                        const payload = JSON.parse(json);
                        const user = {
                            userId: payload.userId || payload.sub || 'cadet',
                            name: payload.name || payload.displayName || 'Space Cadet',
                            email: payload.email || '',
                            role: payload.role || 'member',
                            expiresAt: payload.expiresAt || payload.exp || 0
                        };
                        localStorage.setItem(SSO_STORAGE_KEY, JSON.stringify(user));
                    }
                } catch (e) {
                    console.warn('Failed to parse SSO ticket in head guard:', e);
                }
                window.history.replaceState({}, '', window.location.pathname);
            }

            try {
                const raw = localStorage.getItem(SSO_STORAGE_KEY);
                if (raw) {
                    const u = JSON.parse(raw);
                    if (u && (!u.expiresAt || u.expiresAt * 1000 > Date.now())) {
                        return; // Authenticated
                    }
                }
            } catch (e) {}

            // Unauthenticated -> Redirect immediately to login page
            window.location.replace('login.html');
        })();
    </script>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                if (
                    typeof text === 'string' && (
                        text.includes('GL_OES_EGL_image_external') ||
                        text.includes('emscripten_set_main_loop_timing') ||
                        text.includes('post-exception status') ||
                        text.includes('ScriptProcessorNode is deprecated')
                    )
                ) {
                    console.debug(text);
                    return;
                }
                console.warn(text);
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;

                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                    progressElement.value = parseInt(m[2]) * 100;
                    progressElement.max = parseInt(m[4]) * 100;
                    progressElement.hidden = false;
                } else {
                    progressElement.value = null;
                    progressElement.max = null;
                    progressElement.hidden = true;

                    var canvas = document.getElementById('canvas');
                    canvas.style.display = "";
                }
                statusElement.innerHTML = text;

                if (text === "") {
                    statusElement.style.display = "none";
                    progressElement.style.display = "none";
                } else {
                    statusElement.style.display = "";
                    progressElement.style.display = "";
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        window.Module = Module;
        Module.setStatus('Downloading...');
        window.onerror = function (msg, url, line) {
            console.debug('Pinball runtime event:', msg, url, line);
        };
    </script>

        // ====================================================================

        // ====================================================================
        const SSO_STORAGE_KEY = 'pinball_portal_user';
        const PORTAL_URL = 'https://portal.vikramtiwari.com';

        function parseSSOTicket(ticket) {
            try {
                const parts = ticket.split('.');
                if (parts.length < 2) return null;
                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const padded = base64.padEnd(base64.length + (4 - (base64.length % 4)) % 4, '=');
                const json = decodeURIComponent(
                    atob(padded)
                        .split('')
                        .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                const payload = JSON.parse(json);
                return {
                    userId: payload.userId || payload.sub || 'cadet',
                    name: payload.name || payload.displayName || 'Space Cadet',
                    email: payload.email || '',
                    role: payload.role || 'member',
                    expiresAt: payload.expiresAt || payload.exp || 0
                };
            } catch (err) {
                console.warn('Failed to decode SSO ticket payload:', err);
                return null;
            }
        }

        function getStoredUser() {
            try {
                const raw = localStorage.getItem(SSO_STORAGE_KEY);
                if (!raw) return null;
                const u = JSON.parse(raw);
                if (u.expiresAt && u.expiresAt * 1000 < Date.now()) {
                    localStorage.removeItem(SSO_STORAGE_KEY);
                    return null;
                }
                return u;
            } catch {
                return null;
            }
        }

        function getCallsign(u) {
            if (!u) return 'CAD';
            const raw = u.userId || u.name || 'CAD';
            const clean = raw.replace(/[^a-zA-Z0-9]/g, '').slice(0, 3).toUpperCase();
            return clean.padEnd(3, 'X');
        }

        // Process URL SSO Ticket
        function extractTicket() {
            try {
                const searchParams = new URLSearchParams(window.location.search);
                const hashStr = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
                const hashParams = new URLSearchParams(hashStr);
                return searchParams.get('ticket') || searchParams.get('ssoTicket') || searchParams.get('sso_ticket') || searchParams.get('token') ||
                       hashParams.get('ticket') || hashParams.get('ssoTicket') || hashParams.get('sso_ticket') || hashParams.get('token');
            } catch {
                return null;
            }
        }

        const ssoTicket = extractTicket();
        if (ssoTicket) {
            const parsedUser = parseSSOTicket(ssoTicket);
            if (parsedUser) {
                localStorage.setItem(SSO_STORAGE_KEY, JSON.stringify(parsedUser));
                console.log('✔ Portal SSO Authenticated:', parsedUser);

            const cleanUrl = window.location.pathname;
            window.history.replaceState({}, '', cleanUrl);

        let currentUser = null;

                return false;
            }
            return true;

                localStorage.removeItem(SSO_STORAGE_KEY);
                window.location.replace('login.html');

        enforceAuth();

        function getCadetRank(score) {

            if (score >= 5000000) return 'Commodore';
            if (score >= 2000000) return 'Commander';
            if (score >= 1000000) return 'Lieutenant';
            if (score >= 500000) return 'Ensign';

        }

        const scoresCol = collection(db, 'pinball_scores');
        const gamesCol = collection(db, 'pinball_games');

        // Navigation bindings
        document.getElementById('btn-hall-of-fame')?.addEventListener('click', () => {
            window.location.href = 'leaderboard.html';
        });
        document.getElementById('btn-hud-hof')?.addEventListener('click', () => {
            exitFullscreen();
            window.location.href = 'leaderboard.html';
        });

        // ====================================================================
        // LIVE GAME SESSION & 1-MINUTE SCORE STREAMING ENGINE
        // ====================================================================
        let activeGameSession = null;
        let streamingTimer = null;
        let currentLiveScore = 0;
        let lastStreamedScore = -1;
        let lastStreamedTime = 0;

        async function createNewGameSession(initialScore = 0) {
            currentUser = currentUser || getStoredUser();
            if (!currentUser) return null;

            const gameId = `${currentUser.userId}_${Date.now()}`;
            const session = {
                gameId: gameId,
                userId: currentUser.userId,
                playerName: getCallsign(currentUser),
                displayName: currentUser.name || currentUser.userId,
                userEmail: currentUser.email || '',
                score: initialScore,
                rankTitle: getCadetRank(initialScore),
                status: 'active',
                startedAt: serverTimestamp(),
                updatedAt: serverTimestamp(),
                completedAt: null,
                startTimeMs: Date.now()
            };

            activeGameSession = session;
            lastStreamedScore = initialScore;
            lastStreamedTime = Date.now();

            try {
                await setDoc(doc(db, 'pinball_games', gameId), session);
                console.log(`🚀 [Flight Session Started] Streaming session created: ${gameId}`);
            } catch (err) {
                console.warn('Failed to initialize active game session in Firestore:', err);
            }

            if (!streamingTimer) {
                streamingTimer = setInterval(streamActiveScoreToFirebase, 60000); // 60 seconds (1 minute)
            }

            return session;
        }

        async function streamActiveScoreToFirebase() {
            if (!activeGameSession) return;
            if (currentLiveScore === lastStreamedScore && lastStreamedTime > 0) return;

            try {
                const gameDocRef = doc(db, 'pinball_games', activeGameSession.gameId);
                await updateDoc(gameDocRef, {
                    score: currentLiveScore,
                    rankTitle: getCadetRank(currentLiveScore),
                    updatedAt: serverTimestamp()
                });
                lastStreamedScore = currentLiveScore;
                lastStreamedTime = Date.now();
                console.log(`⏱️ [Minute Stream Sync] Updated Firestore score for [${activeGameSession.playerName}]: ${currentLiveScore.toLocaleString()}`);
            } catch (err) {
                console.warn('Error during minute-by-minute score streaming:', err);
            }
        }

        async function completeActiveGameSession(finalScore, reason = 'Game Finished') {
            if (!activeGameSession) return;

            const session = activeGameSession;
            activeGameSession = null;

            const effectiveScore = Math.max(session.score || 0, finalScore || 0, currentLiveScore || 0);
            const durationSeconds = Math.max(1, Math.round((Date.now() - (session.startTimeMs || Date.now())) / 1000));
            const rankTitle = getCadetRank(effectiveScore);

            console.log(`🏁 [Flight Session Completed] ${reason} - Final Score: ${effectiveScore.toLocaleString()} (${rankTitle})`);

            try {
                const gameDocRef = doc(db, 'pinball_games', session.gameId);
                await updateDoc(gameDocRef, {
                    score: effectiveScore,
                    rankTitle: rankTitle,
                    status: 'completed',
                    completedAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    durationSeconds: durationSeconds
                });

                if (effectiveScore > 0) {
                    await checkAndUpdateGlobalTop10(effectiveScore, session.playerName);
                }

                showToast(`🚀 [${session.playerName}] Flight Record Saved: ${effectiveScore.toLocaleString()} (${rankTitle})`);
            } catch (err) {
                console.warn('Failed to complete flight record in Firestore:', err);
            } finally {
                currentLiveScore = 0;
                lastStreamedScore = -1;
            }
        }

        async function checkAndUpdateGlobalTop10(scoreVal, callsignVal) {
            try {
                const topSnap = await getDocs(query(scoresCol, orderBy('score', 'desc'), limit(10)));
                let qualifies = true;
                if (topSnap.size >= 10) {
                    const lowestTopScore = topSnap.docs[topSnap.docs.length - 1].data().score;
                    if (scoreVal <= lowestTopScore) {
                        qualifies = false;
                    }
                }

                if (qualifies) {
                    const rankTitle = getCadetRank(scoreVal);
                    await addDoc(scoresCol, {
                        playerName: callsignVal,
                        userId: currentUser.userId || 'cadet',
                        userEmail: currentUser.email || '',
                        score: scoreVal,
                        rankTitle: rankTitle,
                        timestamp: serverTimestamp()
                    });
                    console.log(`⭐ [Global Fleet Leaderboard] New Top 10 record recorded for ${callsignVal}: ${scoreVal}`);

                    const allSnap = await getDocs(query(scoresCol, orderBy('score', 'desc')));
                    if (allSnap.size > 10) {
                        for (let i = 10; i < allSnap.docs.length; i++) {
                            await deleteDoc(doc(db, 'pinball_scores', allSnap.docs[i].id)).catch(() => {});
                        }
                    }
                }
            } catch (err) {
                console.warn('Global leaderboard check notice:', err);
            }
        }

        // Handle live score events from pinball engine
        function handleLiveScoreChange(newScore, source = 'Game Engine') {
            if (typeof newScore !== 'number' || isNaN(newScore) || newScore < 0 || newScore >= 2000000000) return;
            window.latestPinballScore = newScore;

            if (newScore === 0) {
                if (activeGameSession && currentLiveScore > 0) {
                    completeActiveGameSession(currentLiveScore, 'Game Restart');
                }
                currentLiveScore = 0;
                return;
            }

            if (newScore > currentLiveScore) {
                currentLiveScore = newScore;
                if (!activeGameSession) {
                    createNewGameSession(newScore);
                } else {
                    activeGameSession.score = newScore;
                }
            }
        }

        // Game Menu Actions
        const triggerNewGame = () => {
            if (activeGameSession && currentLiveScore > 0) {
                completeActiveGameSession(currentLiveScore, 'New Game Triggered');
            }
            const canvas = document.getElementById('canvas');
            if (canvas) canvas.focus();
            window.dispatchEvent(new KeyboardEvent('keydown', { key: 'F2', keyCode: 113, which: 113, bubbles: true }));
            setTimeout(() => {
                window.dispatchEvent(new KeyboardEvent('keyup', { key: 'F2', keyCode: 113, which: 113, bubbles: true }));
            }, 50);
        };

        const isFullscreenActive = () => {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement ||
                document.body.classList.contains('css-fullscreen') ||
                document.getElementById('game-container')?.classList.contains('is-fullscreen')
            );
        };

        const enterFullscreen = async () => {
            const container = document.getElementById('game-container') || document.documentElement;
            const canvas = document.getElementById('canvas');

            document.body.classList.add('css-fullscreen');
            container.classList.add('is-fullscreen');

            try {
                if (container.requestFullscreen) {
                    await container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.mozRequestFullScreen) {
                    container.mozRequestFullScreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } catch (e) {
                console.warn('Native requestFullscreen notice:', e);
            }

            if (canvas) setTimeout(() => canvas.focus(), 150);
        };

        const exitFullscreen = async () => {
            const container = document.getElementById('game-container') || document.documentElement;
            const canvas = document.getElementById('canvas');

            document.body.classList.remove('css-fullscreen');
            container.classList.remove('is-fullscreen');

            try {
                const hasFs = document.fullscreenElement ||
                    document.webkitFullscreenElement ||
                    document.mozFullScreenElement ||
                    document.msFullscreenElement;

                if (hasFs && document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (hasFs && document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (hasFs && document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (hasFs && document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            } catch (e) {
                console.warn('Native exitFullscreen notice:', e);
            }

            if (canvas) setTimeout(() => canvas.focus(), 150);
        };

        const toggleFullscreen = () => {
            if (isFullscreenActive()) {
                exitFullscreen();
            } else {
                enterFullscreen();
            }
        };

        document.getElementById('btn-new-game')?.addEventListener('click', triggerNewGame);
        document.getElementById('btn-hud-new-game')?.addEventListener('click', triggerNewGame);
        document.getElementById('btn-hud-exit-fs')?.addEventListener('click', exitFullscreen);
        document.getElementById('btn-toggle-fullscreen')?.addEventListener('click', toggleFullscreen);

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isFullscreenActive()) {
                exitFullscreen();
            }
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
            if (e.key === 'F3') {
                e.preventDefault();
                window.location.href = 'leaderboard.html';
            }
        });

        const syncFullscreenState = () => {
            const hasNativeFs = Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            if (!hasNativeFs) {
                document.body.classList.remove('css-fullscreen');
                document.getElementById('game-container')?.classList.remove('is-fullscreen');
            } else {
                document.body.classList.add('css-fullscreen');
                document.getElementById('game-container')?.classList.add('is-fullscreen');
            }
            const canvas = document.getElementById('canvas');
            if (canvas) setTimeout(() => canvas.focus(), 150);
        };

        document.addEventListener('fullscreenchange', syncFullscreenState);
        document.addEventListener('webkitfullscreenchange', syncFullscreenState);
        document.addEventListener('mozfullscreenchange', syncFullscreenState);
        document.addEventListener('MSFullscreenChange', syncFullscreenState);

        // ====================================================================
        // AUTOMATIC HIGH SCORE & RUNTIME MEMORY POLLEYS
        // ====================================================================
        function extractScoresFromRawText(text) {
            if (!text || typeof text !== 'string') return [];
            const found = [];
            const regexes = [
                /(?:High\s*Score\s*\d*|Score\s*\d*|\.Score|score|Score\.\d+)\s*[:=]\s*(\d+)/gi,
                /(?:High\s*Score\s*\d*|Score\s*\d*|\.Score)\s+(\d+)/gi,
                /^\s*(\d{4,9})\s*$/gm
            ];

            for (const re of regexes) {
                const matches = [...text.matchAll(re)];
                for (const m of matches) {
                    const num = parseInt(m[1], 10);
                    if (!isNaN(num) && num > 1000 && num < 2000000000) {
                        found.push(num);
                    }
                }
            }
            return found;
        }

        function inspectDataBuffer(name, data) {
            try {
                if (!data) return;
                let text = '';
                if (typeof data === 'string') {
                    text = data;
                } else if (data instanceof Uint8Array || data.buffer) {
                    text = new TextDecoder('utf-8', { fatal: false }).decode(data);
                }
                if (!text) return;

                const scores = extractScoresFromRawText(text);
                for (const s of scores) {
                    handleLiveScoreChange(s, `File (${name || 'data'})`);
                }
            } catch (err) {}
        }

        window.onPinballStreamClose = (name, data) => inspectDataBuffer(name, data);
        window.onPinballFileWrite = (path, data) => inspectDataBuffer(path, data);
        window.onPinballSyncFS = () => scanPinballFS();

        function scanPinballFS() {
            try {
                const FS = window.PinballFS || (window.Module && window.Module.FS);
                if (!FS) return;

                function traverse(dir) {
                    try {
                        const entries = FS.readdir(dir);
                        for (const item of entries) {
                            if (item === '.' || item === '..') continue;
                            const full = (dir === '/' ? '' : dir) + '/' + item;
                            try {
                                const lookup = FS.lookupPath(full);
                                if (!lookup || !lookup.node) continue;
                                if (FS.isDir(lookup.node.mode)) {
                                    traverse(full);
                                } else {
                                    if (
                                        full.endsWith('.ini') ||
                                        full.endsWith('.dat') ||
                                        full.endsWith('.cfg') ||
                                        full.endsWith('.txt') ||
                                        full.includes('pb') ||
                                        full.includes('pinball') ||
                                        full.includes('score') ||
                                        full.includes('imgui')
                                    ) {
                                        const buf = FS.readFile(full);
                                        inspectDataBuffer(full, buf);
                                    }
                                }
                            } catch (e) {}
                        }
                    } catch (e) {}
                }

                traverse('/');
            } catch (e) {}
        }

        let lockedScoreOffset = -1;
        function scanWasmMemoryForScore() {
            try {
                const M = window.Module;
                if (!M || !M.HEAP32) return;
                const heap32 = M.HEAP32;
                const len = heap32.length;
                if (len === 0) return;

                if (lockedScoreOffset >= 0 && lockedScoreOffset < len) {
                    const candidate = heap32[lockedScoreOffset];
                    if (candidate >= 0 && candidate < 2000000000 && candidate % 10 === 0) {
                        if (candidate !== currentLiveScore) {
                            handleLiveScoreChange(candidate, 'HEAP32 Fast');
                        }
                        return;
                    }
                    lockedScoreOffset = -1;
                }

                scanPinballFS();
            } catch (e) {}
        }

        setInterval(() => {
            scanWasmMemoryForScore();
        }, 150);

        window.addEventListener('beforeunload', () => {
            if (activeGameSession && currentLiveScore > 0) {
                completeActiveGameSession(currentLiveScore, 'Page Unload');
            }
        });

        window.addEventListener('pagehide', () => {
            if (activeGameSession && currentLiveScore > 0) {
                completeActiveGameSession(currentLiveScore, 'Page Hide');
            }
        });
    </script>
</body>
